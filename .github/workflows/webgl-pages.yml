name: webgl pages

# 把 games/ 下所有游戏打成 WebGL，部署到 GitHub Pages。
# 需要的 secrets：UNITY_USERNAME、UNITY_PASSWORD（Personal 授权）。
# 仓库 Settings → Pages → Build and deployment → Source 需选 "GitHub Actions"。

on:
  push:
    branches: [master]
    paths:
      - games/**
      - packages/**
      - player/**
      - js/**
      - tools/build-pages.js
      - tools/install-puerts.ps1
      - .github/workflows/webgl-pages.yml
  workflow_dispatch:
    inputs:
      games:
        description: '只构建这些游戏（games 下的目录名，逗号分隔；留空为全部）'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: webgl-pages
  cancel-in-progress: true

env:
  PUERTS_VERSION: 3.0.3
  UNITY_VERSION: 6000.6.8f1

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # third_party/puerts 不入库，从 Puerts 官方 Release 下载 core / v8 / webgl 后用仓库脚本安装（含 JsEnv.cs 补丁）
      - name: Install Puerts
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'puerts'
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          foreach ($n in 'Core', 'V8', 'Webgl') {
            $file = Join-Path $env:RUNNER_TEMP "PuerTS_$n.tar.gz"
            curl.exe -fsSL --retry 3 -o $file "https://github.com/Tencent/puerts/releases/download/Unity_v$env:PUERTS_VERSION/PuerTS_${n}_$env:PUERTS_VERSION.tar.gz"
            if ($LASTEXITCODE -ne 0) { throw "download PuerTS_$n failed" }
            tar -xzf $file -C $src
            if ($LASTEXITCODE -ne 0) { throw "extract PuerTS_$n failed" }
          }
          Get-ChildItem $src | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Host
          & ./tools/install-puerts.ps1 -Source $src

      # WebGL 拿不到系统字体，发布包要内置中文字体子集（OFL，可再分发）
      - name: Download Noto Sans SC
        shell: pwsh
        run: |
          $font = Join-Path $env:RUNNER_TEMP 'NotoSansSC-Regular.otf'
          curl.exe -fsSL --retry 3 -o $font https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          if ($LASTEXITCODE -ne 0) { throw 'download font failed' }
          "POT_FONT=$font" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build JS runtime
        shell: pwsh
        working-directory: js
        run: |
          npm ci --no-audit --no-fund
          node scripts/build.js

      - name: Setup Unity
        uses: RageAgainstThePixel/unity-setup@v3
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          build-targets: StandaloneWindows64, WebGL
          modules: webgl
          cache-installation: true
          version-file: None

      - uses: RageAgainstThePixel/activate-unity-license@v3
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      # Unity 2022.3 Editor 的 OpenRL.dll 依赖 VC++ 2010 运行时，windows-2022 镜像里没有，
      # 缺失时 Unity.exe 以 0xC0000135 直接退出
      - name: Install VC++ 2010 Redistributable
        shell: pwsh
        run: |
          choco install vcredist2010 -y --no-progress
          if (-not (Test-Path "$env:WINDIR\System32\MSVCP100.dll")) { throw 'MSVCP100.dll still missing after installing vcredist2010' }

      # 诊断用：先出一个 Win64 包（Mono，Windows 编辑器自带，无需额外模块），
      # 用来区分是授权整体失效，还是只有 WebGL 构建拿不到授权。失败不阻断后续步骤
      - name: Build Win64 (license probe)
        continue-on-error: true
        shell: pwsh
        run: |
          $client = Join-Path $env:APPDATA 'UnityHub\external-modules\licensingClient\Unity.Licensing.Client.exe'
          if (Test-Path $client) {
            Write-Host '----- showEntitlements -----'
            & $client --showEntitlements
          }
          Get-ChildItem 'C:\ProgramData\Unity' -Filter *.ulf -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "ulf: $($_.FullName) $($_.Length) bytes $($_.LastWriteTime)" }
          node js/devserver/cli.js release games/hello --platform win64 --unity $env:UNITY_EDITOR_PATH --out (Join-Path $env:RUNNER_TEMP 'win64')
          $code = $LASTEXITCODE
          $log = 'games/hello/.pot/release/unity-win64.log'
          if ($code -ne 0 -and (Test-Path $log)) {
            Write-Host '----- unity-win64.log: tail -----'
            Get-Content $log -Tail 80
          }
          exit $code

      # 不加 -nographics（内置着色器导入需要图形设备），release.js 已按此调用
      - name: Build WebGL demos
        shell: pwsh
        env:
          GAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.games || '' }}
        run: |
          $argv = @('tools/build-pages.js', '--out', 'site', '--unity', $env:UNITY_EDITOR_PATH)
          if ($env:GAMES) { $argv += @('--games', $env:GAMES) }
          node @argv
          $code = $LASTEXITCODE
          $log = 'games/hello/.pot/release/unity-webgl.log'
          if ($code -ne 0 -and (Test-Path $log)) {
            Write-Host '----- unity-webgl.log: tail -----'
            Get-Content $log -Tail 80
          }
          if ($code -ne 0) { exit $code }

      - name: Upload Unity logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: games/*/.pot/release/unity-*.log
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
