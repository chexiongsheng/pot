name: build & publish

# Personal 授权同一时间只能在一台机器上激活，所以用到 Unity 的 job 严格串行：
#   build（Windows）：激活一次授权，依次完成
#     1. Win64（IL2CPP）：构建 Runner 与 games/ 下各游戏，打 zip 作为 artifact
#     2. WebGL：构建各游戏的 WebGL，汇总成静态站点部署到 GitHub Pages
#   build-macos（只在发 Release 时）：等 build 结束（其 post 步骤已归还授权）后再激活，
#     构建 macOS（IL2CPP，arm64+x86_64）的 Runner 与各游戏，打 zip 作为 artifact
#   release：手动运行且填了版本号、且上面都成功时，发布 GitHub Release v<版本号>（附 Win64 与 macOS 的 zip）
# 需要的 secrets：UNITY_USERNAME、UNITY_PASSWORD。
# 仓库 Settings → Pages → Build and deployment → Source 需选 "GitHub Actions"。

on:
  push:
    branches: [master]
    paths:
      - games/**
      - packages/**
      - player/**
      - runner/**
      - native/**
      - js/**
      - tools/build-pages.js
      - tools/install-puerts.ps1
      - tools/puerts-patches/**
      - .github/workflows/ci.yml
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.2.0）。留空只构建；填写则发布 Release v<版本号>'
        required: false
        default: ''
      games:
        description: '只构建这些游戏（games 下的目录名，逗号分隔；留空为全部）'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# 全局串行：同一时间只有一个运行占用 Unity 授权。不取消进行中的运行（可能正在发 Release），新的运行排队
concurrency:
  group: unity-license
  cancel-in-progress: false

env:
  PUERTS_VERSION: 3.0.4
  UNITY_VERSION: 6000.6.8f1
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
  GAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.games || '' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 340
    outputs:
      pages: ${{ steps.webgl.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        if: ${{ env.VERSION != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') { throw "版本号格式不对：$env:VERSION（应为 1.2.3 或 1.2.3-beta.1）" }
          gh release view "v$env:VERSION" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release v$env:VERSION 已存在" }
          exit 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # third_party/puerts 不入库，从 Puerts 官方 Release 下载 core / v8 / webgl 后用仓库脚本安装（含 JsEnv.cs 补丁）
      - name: Install Puerts
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'puerts'
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          foreach ($n in 'Core', 'V8', 'Webgl') {
            $file = Join-Path $env:RUNNER_TEMP "PuerTS_$n.tar.gz"
            curl.exe -fsSL --retry 3 -o $file "https://github.com/Tencent/puerts/releases/download/Unity_v$env:PUERTS_VERSION/PuerTS_${n}_$env:PUERTS_VERSION.tar.gz"
            if ($LASTEXITCODE -ne 0) { throw "download PuerTS_$n failed" }
            tar -xzf $file -C $src
            if ($LASTEXITCODE -ne 0) { throw "extract PuerTS_$n failed" }
          }
          & ./tools/install-puerts.ps1 -Source $src
      # 发布包内置中文字体子集（OFL，可再分发；WebGL 拿不到系统字体）
      - name: Download Noto Sans SC
        shell: pwsh
        run: |
          $font = Join-Path $env:RUNNER_TEMP 'NotoSansSC-Regular.otf'
          curl.exe -fsSL --retry 3 -o $font https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          if ($LASTEXITCODE -ne 0) { throw 'download font failed' }
          "POT_FONT=$font" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build JS runtime
        shell: pwsh
        working-directory: js
        run: |
          npm ci --no-audit --no-fund
          node scripts/build.js

      # WebGL 侧只是把 native/pot_gfx/src 的源码同步进 Plugins，缺了才同步
      - name: Sync pot_gfx sources (WebGL)
        shell: pwsh
        run: node js/devserver/cli.js native --platform webgl --unity $env:UNITY_EDITOR_PATH

      - name: Setup Unity
        uses: RageAgainstThePixel/unity-setup@v3
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          build-targets: StandaloneWindows64, WebGL
          modules: windows-il2cpp, webgl
          cache-installation: true
          version-file: None

      # 只激活这一次；job 结束时 action 的 post 步骤会归还授权
      - uses: RageAgainstThePixel/activate-unity-license@v3
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      # Unity Editor 的 OpenRL.dll 依赖 VC++ 2010 运行时，windows-2022 镜像里没有
      # 走微软官方直链，不用 Chocolatey：社区源 community.chocolatey.org 经常返回 503，
      # 会把整条流水线卡在 "Unable to find package 'vcredist2010'"
      - name: Install VC++ 2010 Redistributable
        shell: pwsh
        run: |
          $url = 'https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x64.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'vcredist_x64_2010.exe'
          curl.exe -fsSL --retry 3 -o $exe $url
          if ($LASTEXITCODE -ne 0) { throw 'download vcredist2010 failed' }
          Start-Process $exe -ArgumentList '/q', '/norestart' -Wait
          if (-not (Test-Path "$env:WINDIR\System32\MSVCP100.dll")) { throw 'MSVCP100.dll still missing after installing vcredist2010' }

      # pot_gfx.dll 不入库：每次都用 CMake 重新编译（--force），不使用缓存
      - name: Build pot_gfx
        shell: pwsh
        run: node js/devserver/cli.js native --platform win64 --force --unity $env:UNITY_EDITOR_PATH

      # ---------- Win64 ----------
      # 不加 -nographics（内置着色器导入需要图形设备），release.js 已按此调用
      - name: Build Runner (Win64)
        id: runner
        shell: pwsh
        run: |
          node js/devserver/cli.js runner --platform win64 --unity $env:UNITY_EDITOR_PATH --out out/runner
          $code = $LASTEXITCODE
          $log = 'release/runner/unity-win64.log'
          if ($code -ne 0 -and (Test-Path $log)) { Write-Host '----- unity-win64.log: tail -----'; Get-Content $log -Tail 80 }
          exit $code

      - name: Build games (Win64)
        id: games
        if: ${{ !cancelled() && steps.runner.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $wanted = if ($env:GAMES) { $env:GAMES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ } } else { $null }
          $failed = @()
          foreach ($dir in Get-ChildItem games -Directory) {
            if (-not (Test-Path (Join-Path $dir.FullName 'manifest.json'))) { continue }
            if ($wanted -and $wanted -notcontains $dir.Name) { continue }
            Write-Host "===== $($dir.Name) ====="
            node js/devserver/cli.js release "games/$($dir.Name)" --platform win64 --unity $env:UNITY_EDITOR_PATH --out "out/games/$($dir.Name)"
            if ($LASTEXITCODE -ne 0) {
              $failed += $dir.Name
              $log = "games/$($dir.Name)/.pot/release/unity-win64.log"
              if (Test-Path $log) { Write-Host "----- ${log} tail -----"; Get-Content $log -Tail 80 }
            }
          }
          if ($failed.Count) { throw "Win64 构建失败：$($failed -join ', ')" }

      # ---------- WebGL → Pages ----------
      # Win64 失败不影响 WebGL 构建与 Pages 部署
      - name: Build WebGL demos
        id: webgl
        if: ${{ !cancelled() && steps.runner.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $argv = @('tools/build-pages.js', '--out', 'site', '--unity', $env:UNITY_EDITOR_PATH)
          if ($env:GAMES) { $argv += @('--games', $env:GAMES) }
          node @argv
          $code = $LASTEXITCODE
          $log = 'games/hello/.pot/release/unity-webgl.log'
          if ($code -ne 0 -and (Test-Path $log)) { Write-Host '----- unity-webgl.log: tail -----'; Get-Content $log -Tail 80 }
          exit $code

      - name: Upload Pages artifact
        if: ${{ !cancelled() && steps.webgl.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # ---------- 打包 / 上传 / 发布 ----------
      - name: Package Win64
        id: package
        if: ${{ !cancelled() && steps.runner.outcome == 'success' }}
        shell: pwsh
        run: |
          $suffix = if ($env:VERSION) { "-$env:VERSION" } else { '' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path out/runner/* -DestinationPath "dist/PotRunner$suffix-win64.zip"
          if (Test-Path out/games) {
            foreach ($dir in Get-ChildItem out/games -Directory) {
              if (-not (Get-ChildItem $dir.FullName -Filter *.exe)) { continue }
              Compress-Archive -Path "$($dir.FullName)/*" -DestinationPath "dist/$($dir.Name)$suffix-win64.zip"
            }
          }
          Get-ChildItem dist | ForEach-Object { Write-Host ("{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)) }

      - name: Upload Win64 builds
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: pot-win64
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload Unity logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: |
            release/runner/unity-*.log
            games/*/.pot/release/unity-*.log
          if-no-files-found: warn

  # ---------- macOS（只在发 Release 时构建） ----------
  # needs: build 保证 Windows 的 job（含归还授权的 post 步骤）结束后才开始，两台机器不会同时占用授权。
  # job 级 if 不能用 env 上下文，直接判断 inputs.version
  build-macos:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && needs.build.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 与 Windows 相同的仓库脚本安装（macOS 镜像自带 pwsh）；不出 WebGL，只要 core / v8
      - name: Install Puerts
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'puerts'
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          foreach ($n in 'Core', 'V8') {
            $file = Join-Path $env:RUNNER_TEMP "PuerTS_$n.tar.gz"
            curl -fsSL --retry 3 -o $file "https://github.com/Tencent/puerts/releases/download/Unity_v$env:PUERTS_VERSION/PuerTS_${n}_$env:PUERTS_VERSION.tar.gz"
            if ($LASTEXITCODE -ne 0) { throw "download PuerTS_$n failed" }
            tar -xzf $file -C $src
            if ($LASTEXITCODE -ne 0) { throw "extract PuerTS_$n failed" }
          }
          & ./tools/install-puerts.ps1 -Source $src

      - name: Download Noto Sans SC
        shell: bash
        run: |
          font="$RUNNER_TEMP/NotoSansSC-Regular.otf"
          curl -fsSL --retry 3 -o "$font" https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          echo "POT_FONT=$font" >> "$GITHUB_ENV"

      - name: Build JS runtime
        shell: bash
        working-directory: js
        run: |
          npm ci --no-audit --no-fund
          node scripts/build.js

      - name: Setup Unity
        uses: RageAgainstThePixel/unity-setup@v3
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          build-targets: StandaloneOSX
          modules: mac-il2cpp
          cache-installation: true
          version-file: None

      - uses: RageAgainstThePixel/activate-unity-license@v3
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      # pot_gfx.bundle 不入库：CMake + Xcode clang 编译（Metal 后端，需要 Unity 自带的 PluginAPI 头文件）
      - name: Build pot_gfx
        shell: bash
        run: node js/devserver/cli.js native --platform macos --force --unity "$UNITY_EDITOR_PATH"

      - name: Diagnose Unity PluginAPI
        if: ${{ failure() }}
        shell: bash
        run: |
          app="${UNITY_EDITOR_PATH%%.app/*}.app"
          echo "UNITY_EDITOR_PATH=$UNITY_EDITOR_PATH"
          ls -la "$app/Contents" || true
          find "$(dirname "$app")" -maxdepth 8 \( -name 'IUnityGraphics*.h' -o -type d -name PluginAPI \) 2>/dev/null | head -n 50 || true
      - name: Build Runner (macOS)
        id: runner
        shell: bash
        run: |
          code=0
          node js/devserver/cli.js runner --platform macos --unity "$UNITY_EDITOR_PATH" --out out/runner || code=$?
          log=release/runner/unity-macos.log
          if [ $code -ne 0 ] && [ -f "$log" ]; then echo '----- unity-macos.log: tail -----'; tail -n 80 "$log"; fi
          exit $code

      - name: Build games (macOS)
        if: ${{ !cancelled() && steps.runner.outcome != 'skipped' }}
        shell: bash
        run: |
          IFS=',' read -ra wanted <<< "$GAMES"
          failed=()
          for dir in games/*/; do
            name=$(basename "$dir")
            [ -f "$dir/manifest.json" ] || continue
            if [ -n "$GAMES" ]; then
              hit=0
              for w in "${wanted[@]}"; do [ "$(echo "$w" | xargs)" = "$name" ] && hit=1; done
              [ $hit = 1 ] || continue
            fi
            echo "===== $name ====="
            if ! node js/devserver/cli.js release "games/$name" --platform macos --unity "$UNITY_EDITOR_PATH" --out "out/games/$name"; then
              failed+=("$name")
              log="games/$name/.pot/release/unity-macos.log"
              if [ -f "$log" ]; then echo "----- $log tail -----"; tail -n 80 "$log"; fi
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "macOS 构建失败：${failed[*]}"; exit 1; fi

      # ditto 打 zip：保留 .app 内的符号链接与可执行权限（zip -r 会破坏 framework 结构）
      - name: Package macOS
        id: package
        if: ${{ !cancelled() && steps.runner.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent out/runner/PotRunner.app "dist/PotRunner-$VERSION-macos.zip"
          if [ -d out/games ]; then
            for dir in out/games/*/; do
              name=$(basename "$dir")
              app=$(find "$dir" -maxdepth 1 -name '*.app' | head -n 1)
              [ -n "$app" ] || continue
              ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$name-$VERSION-macos.zip"
            done
          fi
          ls -lh dist

      - name: Upload macOS builds
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: pot-macos
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload Unity logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs-macos
          path: |
            release/runner/unity-*.log
            games/*/.pot/release/unity-*.log
          if-no-files-found: warn

  # 只有 Win64、WebGL、macOS 全部成功才发 Release
  release:
    needs: [build, build-macos]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pot-*
          path: dist
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          gh release create "v$VERSION" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "pot v$VERSION" --target "$GITHUB_SHA" --generate-notes

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.pages == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
